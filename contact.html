    <main>
        <section>
            <h2>Information Details</h2>
            <div class="date">
                <label for="date">Date</label>
                <input type="date" name="" id="date">
            </div>
            <form>
                <fieldset class="Info">
                    <label for="Name">Name</label>
                    <input type="text" name="info" id="Name" required>
                    <label for="Email">Email</label>
                    <input type="email" name="info" id="Email" required>
                    <!-- <label for="Password">Password</label>
                    <input type="password" name="info" id="Password" required> -->
                    <label for="Phone">Phone</label>
                    <input type="tel" name="info" id="Phone" required>
                    <fieldset>
                        <legend>extra info</legend>
                        <textarea rows="8" cols="60"></textarea>
                    </fieldset>
                </fieldset>
                <input type="submit" value="submit">
                <input type="reset" value="clear">
            </form>
        </section>
    </main>
